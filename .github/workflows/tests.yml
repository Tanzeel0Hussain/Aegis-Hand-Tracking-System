name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q FingerCount.py tracking.py models.py runtime.py tests
      - run: python -m unittest discover -s tests -v
      - name: Download official models
        run: python FingerCount.py --download-models
      - name: Real model initialization and synthetic-frame inference
        run: python FingerCount.py --check
      - name: Hand-only model path
        run: python FingerCount.py --check --no-pose
